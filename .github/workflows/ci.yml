name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # CPU 推論版。RTX 3060 などで GPU 推論するには CUDA Toolkit を入れて `--features cuda` でビルドする
      - run: cargo build --release --locked -p mmm -p markdown-movie-maker
      - uses: actions/upload-artifact@v4
        with:
          name: markdown-movie-maker-windows-x64
          path: |
            target/release/mmm.exe
            target/release/MarkdownMovieMaker.exe
