[package]
name = "markdown-movie-maker"
description = "MarkdownMovieMaker: native Windows editor with live preview, timeline, speech synthesis and export"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
build = "build.rs"

[[bin]]
name = "MarkdownMovieMaker"
path = "src/main.rs"

[features]
default = ["voicevox", "kokoro", "software"]
kokoro = ["mmm-pipeline/kokoro"]
voicevox = ["mmm-pipeline/voicevox"]
cuda = ["mmm-pipeline/cuda"]
software = ["mmm-pipeline/software"]

[dependencies]
mmm-pipeline.workspace = true
mmm-core.workspace = true
mmm-render.workspace = true
mmm-audio.workspace = true
mmm-tts.workspace = true
image.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }

# GUI は yyeditor の Win32 部品（Direct2D/DirectWrite のエディタ・IME・同梱フォント）で作る
[target.'cfg(windows)'.dependencies]
yy-ui-win = { git = "https://github.com/ykwyuta/yyeditor", rev = "a622b504dbe5e86b3a7b1d8e525fef22dc51d725", features = ["help"] }
yy-core = { git = "https://github.com/ykwyuta/yyeditor", rev = "a622b504dbe5e86b3a7b1d8e525fef22dc51d725" }
cpal = "0.18"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

[lints]
workspace = true
